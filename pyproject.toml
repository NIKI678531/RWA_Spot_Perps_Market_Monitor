[project]
name = "rwa-spot-perps-market-monitor"
version = "0.1.0"
description = "Tokenized RWA market monitor — spot scale, venue/issuer competition, perps demand, anomaly detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.3",
    "curl-cffi>=0.15.0",
    "debugpy>=1.8.17",
    "fastapi[standard]>=0.133.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "lxml>=5.3.0",
    "numpy>=2.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pymysql>=1.1.2",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0.47",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = "\\.pyi?$"
exclude = '''
/(
    \.venv
  | \.mypy_cache
  | \.pytest_cache
  | frontend/node_modules
  | frontend/dist
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.12"
files = ["backend"]
pretty = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
exclude = [
    "^frontend/",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]
