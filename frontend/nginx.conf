# Serves the bundle and proxies the API from the same origin, so the browser makes
# same-origin requests in Docker exactly as it does behind the dev server. CORS then
# has nothing to differ about between the two environments.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed filenames: safe to cache forever, and a deploy changes the name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is never cached: it is the only file that names the current bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report generation reads the whole warehouse and writes two documents.
        proxy_read_timeout 120s;
    }

    # Client-side routes: /venues is a React route, not a file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
